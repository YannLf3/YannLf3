name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Serpent aux couleurs du portfolio (vert, avec le cyan en contraste pour le serpent)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#007a8a&color_dots=#ebedf0,#b8f0da,#6fe0b5,#2fc58f,#00a870
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00d3e5&color_dots=#161b22,#0b3d2e,#007a56,#00c47f,#00f8a8

      # Heatmap de contributions et stats (scripts/gen_profile_assets.py)
      - name: generate contributions.svg and stats.svg
        run: |
          pip install fonttools brotli
          python3 scripts/gen_profile_assets.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push the generated svg files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
